name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: $CC --version

      - name: Build (pedantic C11)
        run: make all

      - name: Unit tests
        run: cc -std=c11 -Wall -Wextra -pedantic network.c tests/test_units.c proof_exp.c -o /tmp/test_units && /tmp/test_units

      - name: Unit tests + ASAN/UBSAN
        run: cc -std=c11 -Wall -Wextra -pedantic -fsanitize=address,undefined network.c tests/test_units.c proof_exp.c -o /tmp/test_units_asan && /tmp/test_units_asan

      - name: Strict proof on known networks
        run: make test

      - name: Verify generators proof_exp
        run: |
          ./gen_network pairwise 16 > /tmp/pairwise16.txt
          ./sorter_exp proof 16 < /tmp/pairwise16.txt
          ./gen_network batcher-odd-even 16 > /tmp/batcher16.txt
          ./sorter_exp proof 16 < /tmp/batcher16.txt
          ./gen_network van-voorhis 16 > /tmp/vv16.txt
          ./sorter_exp proof 16 < /tmp/vv16.txt
          echo "all generators verified"

      - name: -Werror check
        run: make clean && make all CFLAGS="-std=c11 -Wall -Wextra -pedantic -Werror" 2>&1 | tee build.log

      - name: Check no -Werror warnings
        run: test ! -s build.log || (cat build.log; exit 1)
        # actually build.log includes compiler output even on success if warnings as errors disabled, so we check exit above

