name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: $CC --version

      - name: Build (pedantic C11)
        run: make all

      - name: Unit tests
        run: cc -std=c11 -Wall -Wextra -pedantic -D_GNU_SOURCE -I src src/network.c src/search.c tests/test_units.c src/proof_exp.c -o /tmp/test_units && /tmp/test_units

      - name: Unit tests + ASAN/UBSAN
        run: cc -std=c11 -Wall -Wextra -pedantic -D_GNU_SOURCE -I src -fsanitize=address,undefined src/network.c src/search.c tests/test_units.c src/proof_exp.c -o /tmp/test_units_asan && /tmp/test_units_asan

      - name: Strict proof on known networks
        run: make test

      - name: Verify generators proof_exp
        run: |
          for algo in pairwise batcher-odd-even pipelined-mergesort bose-nelson bitonic brick van-voorhis zigzag; do
            echo "== $algo ==";
            ./gen_network $algo 16 > /tmp/net.txt
            ./sorter_exp proof 16 < /tmp/net.txt
          done
          # green is filter, not full sort
          ./gen_network green 16 > /tmp/green.txt
          ./gen_network --validate green 16
          echo "all generators verified"

      - name: clang-format check
        run: |
          if command -v clang-format >/dev/null; then
            find src -name "*.c" -o -name "*.h" | xargs clang-format --dry-run --Werror || echo "run clang-format -i (warning)";
          else echo "clang-format not found, skipping"; fi
      - name: -Werror check
        run: make clean && make all CFLAGS="-std=c11 -Wall -Wextra -pedantic -D_GNU_SOURCE -Werror"

